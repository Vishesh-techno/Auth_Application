spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update


security.jwt.secret=testSecretKeyForJwtAuthentication123456789
security.jwt.issuer=testIssuer

security.jwt.access-ttl-seconds=3600
security.jwt.refresh-ttl-seconds=86400

security.jwt.refresh-token-cookie-name=refreshToken
security.jwt.cookie-secure=false
security.jwt.cookie-http-only=true
security.jwt.cookie-same-site=LAX
security.jwt.cookie-domain=localhost